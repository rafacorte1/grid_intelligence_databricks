bundle:
  name: grid_intelligence
  uuid: 82321802-cc9a-41db-8f93-5a7f8dd941f0

include:
  - resources/*.yml

experimental:
  skip_name_prefix_for_schema: true

sync:
  exclude:
    - landing/**
    - prompts/**
    - .llm/**

variables:
  catalog:
    description: Environment catalog
  duracao_minima_interrupcao:
    description: Minimum interruption duration in minutes for Silver
    default: "3"
  queda_consumo_pct:
    description: Minimum percentage drop against the individual baseline
    default: "30"
  estabilidade_conjunto_pct:
    description: Maximum absolute percentage variation allowed for a stable neighborhood
    default: "10"
  warehouse_id:
    description: Serverless SQL warehouse used for governance and the metric view
  grupo_atendimento:
    description: Account group allowed to read the original personal data
    default: atendimento

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: grid_dev
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
