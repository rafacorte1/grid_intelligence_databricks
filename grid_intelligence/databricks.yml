bundle:
  name: grid_intelligence
  uuid: 82321802-cc9a-41db-8f93-5a7f8dd941f0

include:
  - resources/*.yml

experimental:
  skip_name_prefix_for_schema: true

sync:
  exclude:
    - landing/**
    - prompts/**
    - .llm/**

variables:
  catalog:
    description: Catalogo do ambiente
  duracao_minima_interrupcao:
    description: Duracao minima em minutos para interrupcoes na silver
    default: "3"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-1a1f7eb6-688b.cloud.databricks.com
    variables:
      catalog: grid_dev
  prod:
    mode: production
    workspace:
      host: https://dbc-1a1f7eb6-688b.cloud.databricks.com
      root_path: /Workspace/Users/rafcorte@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: grid_intelligence
    permissions:
      - user_name: rafcorte@gmail.com
        level: CAN_MANAGE
